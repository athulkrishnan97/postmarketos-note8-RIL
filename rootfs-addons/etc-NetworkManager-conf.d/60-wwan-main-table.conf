# greatlte: keep mobile data in the main routing table (metric 700), so
# Wi-Fi (metric 600) simply wins the default route. With the postmarketOS
# default (50-wwan-policy.conf: route-table 1430) NetworkManager keeps the
# mobile connection as its "activating" connection while Wi-Fi is primary,
# and Plasma then shows the cellular icon instead of Wi-Fi.
[connection-wwan-greatlte]
match-device=type:gsm
ipv4.route-table=0
ipv6.route-table=0
